<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游点涩 XP之瓶</title>
<style>
/* 布局：单栏手机优先；顶部总瓶 + 玩家类型选择，下方每题一张卡（小瓶 + 滑杆 + NG），深色单主题 */
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#1d2130; --card:#151925; --panel:#272c3b; --line:#3a4052; --fg:#eef0f6; --muted:#9aa1b3;
  --meh:#5a6072; --no:#4b82e0; --cur:#5fd38a; --love:#f26b9b; --ng:#ff5a5a; --accent:#f26b9b;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);padding:20px 16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:12px;align-items:center}
.welcome{display:flex;gap:12px;align-items:flex-start}.ip{flex:none;width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);background:var(--panel)}.bubble{position:relative;flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px}.bubble b{color:var(--accent);font-size:16px}.bubble p{margin:6px 0 0;font-size:14px;line-height:1.65}.banner{display:block;width:100%;border-radius:14px}.out h2{color:var(--fg)!important;font-weight:700!important;font-size:18px!important}
h1{margin:0;font-size:24px;text-wrap:balance}
.slogan{margin:2px 0 0;font-size:13px;color:var(--accent)}
.sub{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.legend{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.box h2{margin:0;font-size:16px;font-weight:500;color:var(--muted)}
.pairs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pair{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.pair span{font-size:13px;color:var(--muted)}
.chip{font:inherit;font-weight:700;font-size:16px;min-width:48px;height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:#fff;background:var(--accent)}
canvas#jar{width:100%;max-width:320px;height:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.card.ng{border-color:var(--ng)}
.head{display:flex;align-items:center;gap:12px}
.head canvas{flex:none;width:40px;height:52px}
.head h3{margin:0;font-size:19px;flex:1;min-width:0;overflow-wrap:anywhere}
.q{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;cursor:pointer}
.ngb{flex:none;font:inherit;font-size:12px;font-weight:700;line-height:1.1;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.ngb[aria-pressed="true"]{background:var(--ng);border-color:var(--ng);color:#fff}
.desc{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.marks{display:grid;grid-template-columns:6% 34% 26% 34%;font-size:13px;color:var(--muted);text-align:center}
.marks b{font-weight:400}.marks b.on{color:var(--fg);font-weight:700}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:8px;border-radius:99px;margin:0;
  background:linear-gradient(90deg,var(--meh) 0 6%,var(--no) 6% 40%,var(--cur) 40% 66%,var(--love) 66% 100%);opacity:.75}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0008;cursor:pointer}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;cursor:pointer}
.card.ng input[type=range]{opacity:.25}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:140px;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;flex:1}
.out img{max-width:100%;border-radius:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><h1>游点涩 · XP之瓶</h1></header>
  <div class="welcome"><img class="ip" src="ip.webp" alt="游点涩看板娘" width="72" height="72"><div class="bubble"><b>欢迎来到游点涩～</b><p>我是游点涩的看板娘！把你的游戏口味和心动角色一项项倒进瓶子里，看看你是哪一型的玩家吧～做完记得生成图片，晒给同好看看！</p></div></div>
  <p class="sub">每一项拖动滑杆选程度，绝对不行就点「NG」。上面的瓶子会按你的选择装满，做完生成图片长按保存分享。</p>
  <div class="tabs" id="tabs"></div>
  <div class="legend" id="legend"></div>

  <section class="box">
    <h2>选择适合你的类型</h2>
    <div class="pairs" id="pairs"></div>
    <p class="sub">不想回答的话，也可以留空。</p>
    <div class="row" style="width:100%"><input type="text" id="nick" placeholder="你的昵称（显示在瓶签上）" maxlength="12"></div>
    <canvas id="jar" width="640" height="820"></canvas>
  </section>

  <div id="items" style="display:flex;flex-direction:column;gap:14px"></div>

  <div class="row"><input type="text" id="custom" placeholder="添加自定义项目" maxlength="10"><button class="btn" id="add">添加</button></div>
  <div class="row"><button class="btn primary" id="make">生成图片</button><button class="btn" id="reset">清空本瓶</button></div>
  <section class="box out" id="out" hidden><h2>游点涩之瓶图片已生成</h2><p class="sub">长按图片保存（电脑右键另存为）</p><img id="outimg" alt="你的XP之瓶"></section>

  <a href="https://youdianse.com" target="_blank" rel="noopener"><img class="banner" src="banner.webp" alt="游点涩 YOUDIANSE" width="690" height="230"></a>
  <div class="foot" id="foot"></div>
</div>

<script>
// ===== 游点涩品牌配置：替换这里即可 =====
const BRAND={
  name:'游点涩',
  handle:'@【X账号留空】',
  site:'youdianse.com',
  logo:'',                       // 填 data:image/png;base64,... 或同目录图片路径
  slogan:'【品牌标语留空】',
  footer:'公众号 / 社群：【留空】 ｜ 二维码：【留空】'
};
// 滑杆区间：0–6 无感，6–40 抵触，40–66 好奇，66–100 喜欢
const ZONES=[{n:'无感',c:'--meh',max:6},{n:'抵触',c:'--no',max:40},{n:'好奇',c:'--cur',max:66},{n:'喜欢',c:'--love',max:101}];
const zone=v=>ZONES.find(z=>v<z.max);

const T={
 yds:{n:'游点涩之瓶',pairs:[['欧皇','非酋'],['剧情党','速推党']],i:[
  ['后宫养成','同时攻略多位角色，经营你的后宫'],['恋爱养成','一对一慢慢提升好感，走向专属结局'],
  ['二次元后宫','日系二次元画风的后宫题材'],['真人扮演','真人演出的互动影游'],
  ['互动电影','靠选择推动剧情的真人影像作品'],['视觉小说','以文字剧情和立绘CG为主'],
  ['剧情驱动','故事和人物塑造放在第一位'],['换装','给角色换衣服、收集服装'],
  ['羁绊养成','和角色培养专属羁绊'],['快节奏开局','开局直接进入主线，不铺垫'],
  ['修罗场','多位角色争风吃醋'],['都市日常','现代都市里的日常恋爱'],
  ['女性主角','操控女性主角展开故事'],['异世界','穿越到奇幻异世界'],
  ['古风武侠','古代、武侠、江湖题材'],['三国/西游改编','经典名著的二次元改编'],
  ['亚洲3D','3D建模的亚洲风格角色'],['卡牌','抽卡、组卡、养成角色'],
  ['塔防','布阵守关的策略玩法'],['割草','一人砍翻成群敌人'],
  ['放置养成','挂机就能成长'],['模拟经营','经营店铺、势力或城市'],
  ['回合制策略','慢节奏的回合制战斗'],['弹幕射击','躲弹幕的射击玩法'],
  ['AI 伴侣','能和 AI 角色聊天互动'],['盲盒活动','开盒抽奖的限时活动'],
  ['【游点涩自家作品留空】','填入你们主推的作品']]},
 girl:{n:'女性角色口味',pairs:[['姐系','妹系'],['主动型','被动型']],i:[
  ['御姐','成熟、强势、气场全开'],['邻家姐姐','住在隔壁的温柔姐姐'],['女王','高高在上、发号施令'],
  ['温柔大姐姐','包容又会照顾人'],['元气少女','活泼开朗、精力满满（已成年）'],
  ['傲娇','嘴上嫌弃、心里在意'],['病娇','爱到偏执、占有欲极强'],['冰山美人','冷淡高冷、难以接近'],
  ['腹黑','表面乖巧、心机很深'],['天然呆','迷糊可爱、反应慢半拍'],
  ['猫娘','猫耳猫尾、爱撒娇'],['狐娘','狐耳多尾、魅惑系'],['魅魔','神秘妩媚的恶魔族'],
  ['精灵','尖耳长发的异族美人'],['龙娘','龙角龙尾、力量强大'],['吸血鬼','苍白优雅的夜之贵族'],
  ['女仆','忠诚服侍主人'],['修女','禁欲系的圣职人员'],['女教师','知性又严厉'],['护士','白衣天使'],
  ['女将军','战场上的英气女武将'],['战姬/舰娘','机甲、舰装拟人'],['舞娘','舞台上的灵动舞姿'],
  ['古风美人','汉服、旗袍的东方美'],['偶像','舞台上闪闪发光'],
  ['长发及腰','一头飘逸长发'],['大长腿','腿长身高'],['制服控','OL、军装、旗袍等各式制服'],['白毛','银白色头发'],['反差萌','外表和性格反差极大']]},
 free:{n:'自由瓶',pairs:[],i:[]}
};
let cur='yds', st={};
try{st=JSON.parse(localStorage.getItem('ydsjar3')||'{}')}catch(e){}
for(const k in T){st[k]=st[k]||{v:{},ng:{},x:[],p:{}}}
const save=()=>{try{localStorage.setItem('ydsjar3',JSON.stringify(st))}catch(e){}};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const list=()=>T[cur].i.concat(st[cur].x.map(n=>[n,'自定义项目']));

document.getElementById('legend').innerHTML=ZONES.map(z=>`<span><i style="background:var(${z.c})"></i>${z.n}</span>`).join('')+`<span><i style="background:var(--ng)"></i>NG</span>`;
const tabs=document.getElementById('tabs');
for(const k in T){const b=document.createElement('button');b.textContent=T[k].n;b.dataset.k=k;b.onclick=()=>{cur=k;render()};tabs.append(b)}

function miniJar(cv,v,ng){
  const g=cv.getContext('2d'),W=80,H=104;g.clearRect(0,0,W,H);
  const p=()=>{g.beginPath();g.moveTo(24,14);g.lineTo(56,14);g.lineTo(56,22);g.quadraticCurveTo(74,24,74,44);g.lineTo(74,92);g.quadraticCurveTo(74,100,66,100);g.lineTo(14,100);g.quadraticCurveTo(6,100,6,92);g.lineTo(6,44);g.quadraticCurveTo(6,24,24,22);g.closePath()};
  g.save();p();g.clip();
  const f=ng?1:v/100; g.fillStyle=css(ng?'--ng':zone(v).c);g.fillRect(0,100-f*78,W,H);g.restore();
  g.lineWidth=2;g.strokeStyle=css('--muted');p();g.stroke();
  g.fillStyle=css('--muted');g.fillRect(20,6,40,8);
}

function render(){
  [...tabs.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cur));
  const S=st[cur];
  const pw=document.getElementById('pairs');pw.innerHTML='';
  T[cur].pairs.forEach((pr,i)=>{
    const d=document.createElement('div');d.className='pair';
    pr.forEach((lab,j)=>{
      if(j){const s=document.createElement('span');s.textContent='或';d.append(s)}
      const b=document.createElement('button');b.className='chip';b.textContent=lab;
      b.setAttribute('aria-pressed',S.p[i]===lab);
      b.onclick=()=>{S.p[i]=S.p[i]===lab?null:lab;save();render()};d.append(b)});
    pw.append(d)});
  pw.parentElement.querySelector('h2').hidden=pw.nextElementSibling.hidden=!T[cur].pairs.length;
  const box=document.getElementById('items');box.innerHTML='';
  list().forEach(([name,desc])=>{
    const v=S.v[name]??0, ng=!!S.ng[name];
    const c=document.createElement('div');c.className='card'+(ng?' ng':'');
    c.innerHTML=`<div class="head"><canvas width="80" height="104"></canvas><h3></h3><button class="q" aria-label="说明">?</button><button class="ngb" aria-pressed="${ng}">NG<br>设定</button></div>
      <p class="desc" hidden></p><div class="marks"><b></b><b>抵触</b><b>好奇</b><b>喜欢</b></div>
      <input type="range" min="0" max="100" value="${v}" aria-label="">`;
    c.querySelector('h3').textContent=name;c.querySelector('.desc').textContent=desc;
    const r=c.querySelector('input'),cv=c.querySelector('canvas'),mk=c.querySelectorAll('.marks b');
    r.setAttribute('aria-label',name+' 程度');
    const upd=()=>{const vv=+r.value;mk.forEach((m,i)=>m.classList.toggle('on',!S.ng[name]&&ZONES[i]===zone(vv)));miniJar(cv,vv,S.ng[name])};
    r.oninput=()=>{S.v[name]=+r.value;if(S.ng[name]){delete S.ng[name];c.classList.remove('ng');c.querySelector('.ngb').setAttribute('aria-pressed',false)}upd();save();draw()};
    c.querySelector('.q').onclick=()=>{const d=c.querySelector('.desc');d.hidden=!d.hidden};
    c.querySelector('.ngb').onclick=()=>{S.ng[name]=!S.ng[name];if(!S.ng[name])delete S.ng[name];save();render()};
    upd();box.append(c)});
  draw();
}

function draw(){
  const c=document.getElementById('jar'),g=c.getContext('2d'),W=640,H=820,S=st[cur];
  g.clearRect(0,0,W,H);g.fillStyle=css('--panel');g.fillRect(0,0,W,H);
  const nick=document.getElementById('nick').value.trim();
  const L=110,R=530,bot=720;
  const path=()=>{g.beginPath();g.moveTo(220,150);g.lineTo(420,150);g.lineTo(420,190);g.quadraticCurveTo(R,200,R,280);g.lineTo(R,bot-40);g.quadraticCurveTo(R,bot,R-40,bot);g.lineTo(L+40,bot);g.quadraticCurveTo(L,bot,L,bot-40);g.lineTo(L,280);g.quadraticCurveTo(L,200,220,190);g.closePath()};
  const items=list().map(([n])=>({n,v:S.v[n]??0,ng:!!S.ng[n]})).filter(o=>o.ng||o.v>=6);
  items.sort((a,b)=>(b.ng-a.ng)||(a.v-b.v));
  const weight=o=>o.ng?60:o.v, tot=items.reduce((s,o)=>s+weight(o),0);
  const cap=(bot-230)*Math.min(1,items.length/Math.max(8,list().length*.6));
  g.save();path();g.clip();g.fillStyle=css('--card');g.fillRect(0,0,W,H);
  let y=bot;g.textAlign='center';g.textBaseline='middle';
  items.forEach((o,i)=>{
    const h=tot?cap*weight(o)/tot:0;
    g.fillStyle=css(o.ng?'--ng':zone(o.v).c);
    g.beginPath();g.moveTo(0,y);for(let x=0;x<=W;x+=20)g.lineTo(x,y-h+Math.sin(x/45+i)*4);g.lineTo(W,y);g.closePath();g.fill();
    if(h>=14){g.fillStyle='rgba(15,18,28,.9)';g.font=`700 ${Math.min(h*.65,24)}px ${css('--font')}`;g.fillText(o.ng?o.n+' ✕':o.n,W/2+Math.sin(i*2.3)*100,y-h/2)}
    y-=h});
  g.restore();
  g.lineWidth=6;g.strokeStyle=css('--fg');path();g.stroke();
  g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(L+40,420,10,120,0,0,7);g.fill();
  g.fillStyle=css('--accent');g.beginPath();g.roundRect(205,110,230,48,12);g.fill();
  g.fillStyle='#fff';g.font=`700 22px ${css('--font')}`;g.fillText(BRAND.name,W/2,135);
  g.fillStyle=css('--fg');g.font=`700 34px ${css('--font')}`;
  g.fillText((nick?nick+'的':'我的')+T[cur].n,W/2,44);
  const tg=Object.values(S.p||{}).filter(Boolean).join(' · ');
  g.font=`400 20px ${css('--font')}`;g.fillStyle=css('--accent');if(tg)g.fillText(tg,W/2,84);
  g.fillStyle=css('--muted');g.font=`400 18px ${css('--font')}`;
  g.fillText(`喜欢 ${items.filter(o=>!o.ng&&o.v>=66).length} · 好奇 ${items.filter(o=>!o.ng&&o.v>=40&&o.v<66).length} · NG ${items.filter(o=>o.ng).length}`,W/2,760);
  g.fillText(`${BRAND.site}  ${BRAND.handle}`,W/2,795);
}

document.getElementById('nick').oninput=draw;
document.getElementById('add').onclick=()=>{const i=document.getElementById('custom'),v=i.value.trim();if(v&&!list().some(x=>x[0]===v)){st[cur].x.push(v);save();render()}i.value=''};
document.getElementById('custom').onkeydown=e=>{if(e.key==='Enter')document.getElementById('add').click()};
document.getElementById('reset').onclick=()=>{st[cur]={v:{},ng:{},x:[],p:{}};save();render();document.getElementById('out').hidden=true};
document.getElementById('make').onclick=()=>{
  document.getElementById('outimg').src=document.getElementById('jar').toDataURL('image/png');
  const o=document.getElementById('out');o.hidden=false;o.scrollIntoView({behavior:'smooth'})};

document.getElementById('foot').textContent=`${BRAND.name} ${BRAND.site} ｜ X：${BRAND.handle} ｜ ${BRAND.footer} ｜ 本页内容仅限18岁以上`;
if(!Object.keys(st.yds.v).length){Object.assign(st.yds.v,{'后宫养成':88,'换装':75,'剧情驱动':70,'异世界':55,'互动电影':45,'塔防':30});st.yds.ng['修罗场']=true}
render();
</script>
</body>
</html>
